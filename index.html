<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اقتباس اليوم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Cairo', sans-serif;
        background: radial-gradient(circle at top, #1a1a1a, #000000);
        color: white;
    }

    .card {
        width: 420px;
        padding: 50px 30px;
        text-align: center;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255,255,255,0.1);
        transition: 0.3s;
    }

    .card:hover {
        transform: scale(1.02);
        box-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
    }

    .line {
        margin: 20px 0;
        color: rgba(255,255,255,0.4);
        letter-spacing: 2px;
    }

    .quote {
        font-size: 30px;
        font-weight: 700;
        line-height: 2;
        margin: 25px 0;
    }

    .quote span {
        display: block;
    }

    .name {
        margin-top: 35px;
        font-size: 13px;
        color: rgba(255,255,255,0.4);
        letter-spacing: 1px;
    }

    .name::before {
        content: "— ";
    }
</style>

</head>

<body>

<div class="card">

    <div class="line">✦ ───────────── ✦</div>

    <div class="quote">
        <span>هَكَذَا الدُّنْيَا...</span>
        <span>وَكُلُّ مَا عَلَيْهَا فَانٍ.</span>
    </div>

    <div class="line">✦ ───────────── ✦</div>

    <div class="name">
        mohamed ahmed mohamed ghazly
    </div>

</div>

</body>
</html>
