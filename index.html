]<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اقتباس اليوم</title>

    <!-- خط عربي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            text-align: center;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
            max-width: 500px;
        }

        .line {
            margin: 20px 0;
            color: rgba(255,255,255,0.6);
        }

        .quote {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.8;
        }

        .name {
            margin-top: 30px;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="line">✦ ───────────── ✦</div>

    <div class="quote">
        هَكَذَا الدُّنْيَا...<br>
        وَكُلُّ مَا عَلَيْهَا فَانٍ.
    </div>

    <div class="line">✦ ───────────── ✦</div>

    <div class="name">
        mohamed ahmed<br>
        mohamed ghazly
    </div>

</div>

</body>
</html>
