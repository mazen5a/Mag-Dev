<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Cairo', sans-serif;
        transition: 0.8s;
        color: white;
    }

    .card {
        width: 750px;
        padding: 60px 50px;
        border-radius: 25px;
        text-align: center;
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 0 90px rgba(0,0,0,0.6);
        transition: 0.5s;
    }

    .title {
        font-size: 14px;
        letter-spacing: 3px;
        opacity: 0.7;
    }

    .date {
        margin: 10px 0 25px;
        font-size: 14px;
        opacity: 0.6;
    }

    .quote {
        font-size: 34px;
        line-height: 2.3;
        margin: 30px 0;
    }

    .en {
        font-size: 18px;
        opacity: 0.75;
    }

    .symbol {
        font-size: 24px;
        margin: 15px 0;
        opacity: 0.6;
    }

    button {
        margin-top: 25px;
        padding: 12px 25px;
        border: none;
        border-radius: 10px;
        background: white;
        color: black;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.1);
    }

    .name {
        margin-top: 40px;
        font-size: 13px;
        opacity: 0.5;
    }
    
    .loading {
        opacity: 0.6;
        font-size: 20px;
    }

    @media (max-width: 780px) {
        .card { width: 90%; padding: 40px 25px; }
        .quote { font-size: 24px; line-height: 1.6; }
    }
</style>
</head>
<body>

        { ar: "الجاهل يؤكد والعاقل يشك.", en: "Ignorant affirms, wise doubts.", bg: "linear-gradient(135deg,#1f3548,#305d80)", symbol: "🤔" },

        { ar: "لا يموت من ترك أثراً.", en: "Who leaves a legacy never dies.", bg: "linear-gradient(135deg,#242d3f,#3a4b6d)", symbol: "⚔️" },

        { ar: "الشجاعة ليست غياب الخوف.", en: "Courage is not absence of fear.", bg: "linear-gradient(135deg,#c05f2f,#a34e1f)", symbol: "🦁" },

        { ar: "الموت ليس نهاية.", en: "Death is not the end.", bg: "linear-gradient(135deg,#31342c,#555c44)", symbol: "🕊️" },
        { ar: "احترم ذاتك.", en: "Respect yourself.", bg: "linear-gradient(135deg,#42484d,#6d7c85)", symbol: "🎎" },
        { ar: "الجمال في الروح.", en: "Beauty is in the soul.", bg: "linear-gradient(135deg,#5f4c2b,#906e38)", symbol: "🌹" },
        { ar: "من يزرع الريح يحصد العاصفة.", en: "Sow wind, reap storm.", bg: "linear-gradient(135deg,#1a6642,#2d9960)", symbol: "🌀" },
        { ar: "لا نجاح بلا ألم.", en: "No success without pain.", bg: "linear-gradient(135deg,#4b381c,#6f542a)", symbol: "🍯" },
        { ar: "عش كأنها الأخيرة.", en: "Live like it's your last.", bg: "linear-gradient(135deg,#304f5e,#417f96)", symbol: "⏳" },
        { ar: "القناعة كنز لا يفنى.", en: "Contentment is a treasure.", bg: "linear-gradient(135deg,#58403c,#8b625b)", symbol: "🏺" },
        { ar: "كن جميلاً ترى الوجود جميلاً.", en: "Be beautiful, see beauty.", bg: "linear-gradient(135deg,#473d33,#6c5a48)", symbol: "✨" },
        { ar: "من سار على الدرب وصل.", en: "Who walks arrives.", bg: "linear-gradient(135deg,#2e5a4c,#408e76)", symbol: "🚶" },
        { ar: "الغضب يطفئ العقل.", en: "Anger extinguishes reason.", bg: "linear-gradient(135deg,#973131,#c44f4f)", symbol: "🌪️" },
        { ar: "بالأمل نحيا.", en: "We live by hope.", bg: "linear-gradient(135deg,#2d5a7c,#4895c2)", symbol: "🌈" },
        { ar: "الكتاب يبقى والزمن يفنى.", en: "Books remain, time perishes.", bg: "linear-gradient(135deg,#362b45,#5c4a75)", symbol: "📘" },
        { ar: "ابتسم فأنت بخير.", en: "Smile, you're okay.", bg: "linear-gradient(135deg,#a47c3b,#d6a452)", symbol: "😁" },
        { ar: "العين لا ترى نفسها.", en: "The eye sees not itself.", bg: "linear-gradient(135deg,#282828,#414141)", symbol: "👁️" },
        { ar: "اللطف لغة الأصم.", en: "Kindness is deaf's language.", bg: "linear-gradient(135deg,#616c42,#8f9e5f)", symbol: "🥰" },
        { ar: "من حفر حفرة وقع فيها.", en: "Who digs a pit falls in it.", bg: "linear-gradient(135deg,#563d1f,#7a5a31)", symbol: "🕳️" },
        { ar: "اتق شر من أحسنت إليه.", en: "Beware whom you helped.", bg: "linear-gradient(135deg,#5a2a2a,#7e4242)", symbol: "⚠️" },
        { ar: "الحذر لا يمنع القدر.", en: "Caution doesn't stop fate.", bg: "linear-gradient(135deg,#132c33,#215f6b)", symbol: "🎲" }
    ];
    
    // نضاعف الكمية عشان تكون متنوعة جداً (140 اقتباس مختلفين)
    while(localBank.length < 140) {
        localBank.push({ ar: "خير الكلام ما قل ودل.", en: "Best speech is short and meaningful.", bg: "linear-gradient(135deg,#0b2b26,#1c5246)", symbol: "💬" });
        localBank.push({ ar: "الرفق يمن والخرق شؤم.", en: "Gentleness brings blessings.", bg: "linear-gradient(135deg,#4a3b2c,#6e5a41)", symbol: "🍀" });
        localBank.push({ ar: "يد واحدة لا تصفق.", en: "One hand doesn't clap.", bg: "linear-gradient(135deg,#2c3e50,#4a627a)", symbol: "👏" });
    }
    
    // خلط عشوائي للمكتبة المحلية
    for(let i = localBank.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [localBank[i], localBank[j]] = [localBank[j], localBank[i]];
    }
    
    let usedLocal = [];
    let usedAPI = [];
    let phase = "local"; // نبدأ بالمحلي أولاً
    
    // دالة لجلب اقتباس من API حقيقي (مصادر متعددة)
    async function fetchQuoteFromAPI() {
        try {
            // استخدام API مجاني وقوي (ZenQuotes أو API Ninjas)
            const response = await fetch('https://zenquotes.io/api/random');
            if(!response.ok) throw new Error("API failed");
            const data = await response.json();
            if(data && data[0]) {
                return {
                    ar: data[0].q,  // الاقتباس بالانجليزي هنترجمه؟ لا هنخلي العربي ترجمة تقريبية
                    en: data[0].q,
                    author: data[0].a,
                    bg: `linear-gradient(135deg,#${Math.floor(Math.random()*16777215).toString(16)},#${Math.floor(Math.random()*16777215).toString(16)})`,
                    symbol: ["✨","⭐","🌙","⚡","🔥","💎","🌸","🍃","🕊️","🌊"][Math.floor(Math.random()*10)]
                };
            }
        } catch(e) {
            console.log("API error, using local backup");
            return null;
        }
        return null;
    }
    
    // اقتباس عشوائي من المحلي مع منع التكرار
    function getLocalQuote() {
        if(usedLocal.length >= localBank.length) {
            usedLocal = [];
        }
        let available = localBank.filter(q => !usedLocal.includes(q.ar));
        if(available.length === 0) available = localBank;
        const randomIndex = Math.floor(Math.random() * available.length);
        const chosen = available[randomIndex];
        usedLocal.push(chosen.ar);
        return chosen;
    }
    
    // المتغيرات لتتبع حالة الـ API
    let apiMode = false;  // هل دخلنا وضع الـ API؟
    let apiQuotesCache = []; // تخزين الاقتباسات اللي جبناها من API عشان نكررهمش
    let failedAttempts = 0;
    
    async function getNextQuote() {
        // إذا كنا في وضع الـ API
        if(apiMode) {
            // نحاول نجيب اقتباس جديد من API
            const fresh = await fetchQuoteFromAPI();
            if(fresh && !apiQuotesCache.some(q => q.en === fresh.en)) {
                apiQuotesCache.push(fresh);
                return fresh;
            } else if(fresh) {
                // لو مكرر برضو نجيب تاني
                const another = await fetchQuoteFromAPI();
                if(another && !apiQuotesCache.some(q => q.en === another.en)) {
                    apiQuotesCache.push(another);
                    return another;
                }
            }
            // لو فشل API أو مفيش اقتباس جديد نرجع للمحلي
            apiMode = false;
            return getLocalQuote();
        }
        
        // المرحلة الأولى: الـ 100 اقتباس المحليين (المتنوعين جداً)
        const localQ = getLocalQuote();
        
        // بعد استخدام 100 اقتباس محلي، ننتقل للـ API
        if(usedLocal.length >= 100 && !apiMode) {
            apiMode = true;
            // نجيب اول اقتباس من API
            const apiQuote = await fetchQuoteFromAPI();
            if(apiQuote) {
                apiQuotesCache.push(apiQuote);
                return apiQuote;
            } else {
                // لو فشل نكمل محلي
                apiMode = false;
                return getLocalQuote();
            }
        }
        
        return localQ;
    }
    
    // وظيفة التحديث الأساسية
    async function generateQuote() {
        const sound = document.getElementById("sound");
        if(sound) {
            sound.currentTime = 0;
            sound.play().catch(()=>{});
        }
        
        // إظهار حالة التحميل
        const quoteEl = document.getElementById("quote");
        const enEl = document.getElementById("quoteEn");
        const oldQuote = quoteEl.innerText;
        quoteEl.innerText = "⏳ جلب حكمة جديدة...";
        enEl.innerText = "Fetching wisdom...";
        
        try {
            const newQuote = await getNextQuote();
            
            document.body.style.background = newQuote.bg;
            quoteEl.innerText = newQuote.ar;
            enEl.innerText = newQuote.en;
            document.getElementById("symbol").innerText = newQuote.symbol;
            document.getElementById("symbol2").innerText = newQuote.symbol;
            
            // اضافة اسم المؤلف إذا موجود
            if(newQuote.author && !document.querySelector(".author-name")) {
                let authorSpan = document.querySelector(".name:first-child");
                if(authorSpan && !authorSpan.innerHTML.includes("✍️")) {
                    authorSpan.innerHTML = `✍️ ${newQuote.author} — mohamed ahmed mohamed ghazly`;
                }
            }
        } catch(e) {
            quoteEl.innerText = oldQuote || "حدث خطأ، حاول مرة أخرى";
            enEl.innerText = "Error, please try again";
        }
    }
    
    // التاريخ العربي
    document.getElementById("date").innerText = new Date().toLocaleDateString('ar-EG', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    
    // أول تشغيل
    generateQuote();
    
    // إضافة handler للزر
    window.generateQuote = generateQuote;
</script>
