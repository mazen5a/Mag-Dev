<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اقتباس ذكي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cairo', sans-serif;
    transition: 1s;
    color: white;
}

.card {
    width: 720px;
    padding: 60px 50px;
    border-radius: 25px;
    text-align: center;
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 90px rgba(0,0,0,0.6);
}

.title {
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0.7;
}

.date {
    margin: 10px 0 25px;
    font-size: 14px;
    opacity: 0.6;
}

.quote {
    font-size: 34px;
    line-height: 2.3;
    margin: 30px 0;
}

.en {
    font-size: 18px;
    opacity: 0.75;
}

.symbol {
    font-size: 22px;
    margin: 15px 0;
    opacity: 0.5;
}

button {
    margin-top: 25px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

.name {
    margin-top: 40px;
    font-size: 13px;
    opacity: 0.5;
}
</style>

</head>

<body>

<div class="card">

<div class="title">AI QUOTE GENERATOR</div>
<div class="date" id="date"></div>

<div class="symbol" id="symbol"></div>

<div class="quote" id="quote"></div>
<div class="en" id="quoteEn"></div>

<div class="symbol" id="symbol2"></div>

<button onclick="generateQuote()">اقتباس جديد</button>

<div class="name">— mohamed ahmed mohamed ghazly</div>

</div>

<audio id="sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>

// 🔥 "قواعد توليد الاقتباسات"
const subjects = [
"الحياة","الإنسان","الصمت","الألم","القوة","الوقت","الخوف","الحلم","النفس","المصير"
];

const actions = [
"يُعلّمك","يُغيّرك","يكسرُك ثم يبنيك","يختبرك","يرفعك","يتركك","يصنعك","يُظهرك"
];

const endings = [
"لكن لا أحد يفهمه.","ولكنك تنجو.","فتصبح أقوى.","حتى تتغير للأبد.","بدون أن تشعر.","وهذا سر الحياة.","لكن في النهاية تتعلم."
];

const symbols = ["✦","⚡","☾","✧","❖"];

// 🔥 لتجنب التكرار
let usedQuotes = [];

// توليد اقتباس
function generateQuote(){

    let ar, en, key;

    do {
        let s = subjects[Math.floor(Math.random()*subjects.length)];
        let a = actions[Math.floor(Math.random()*actions.length)];
        let e = endings[Math.floor(Math.random()*endings.length)];

        ar = `${s} ${a}... ${e}`;
        en = `${s} changes you... ${e}`;

        key = ar;

    } while(usedQuotes.includes(key));

    usedQuotes.push(key);

    // لو خلصوا نعيد التكرار
    if(usedQuotes.length >= 200){
        usedQuotes = [];
    }

    let symbol = symbols[Math.floor(Math.random()*symbols.length)];
    let bg = `linear-gradient(135deg, #000000, #1a1a1a)`;

    document.body.style.background = bg;
    document.getElementById("quote").innerText = ar;
    document.getElementById("quoteEn").innerText = en;
    document.getElementById("symbol").innerText = symbol;
    document.getElementById("symbol2").innerText = symbol;

    // صوت
    let sound = document.getElementById("sound");
    sound.currentTime = 0;
    sound.play();
}

// تاريخ عربي
document.getElementById("date").innerText =
new Date().toLocaleDateString('ar-EG',{ weekday:'long', year:'numeric', month:'long', day:'numeric' });

// أول تشغيل
generateQuote();

</script>

</body>
</html>
