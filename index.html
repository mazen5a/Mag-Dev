<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اقتباس اليوم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Cairo', sans-serif;
        background: radial-gradient(circle at top, #1a1a1a, #000000);
        color: white;
    }

    .card {
        width: 600px;
        padding: 60px 40px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 80px rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255,255,255,0.15);
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    /* لمعة خفيفة */
    .card::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,0.08), transparent);
        transform: rotate(25deg);
        top: -50%;
        left: -50%;
        animation: shine 6s infinite;
    }

    @keyframes shine {
        0% {transform: translateX(-100%) rotate(25deg);}
        100% {transform: translateX(100%) rotate(25deg);}
    }

    .title {
        font-size: 14px;
        letter-spacing: 3px;
        color: rgba(255,255,255,0.5);
        margin-bottom: 15px;
    }

    .date {
        font-size: 13px;
        color: rgba(255,255,255,0.4);
        margin-bottom: 30px;
    }

    .line {
        margin: 25px 0;
        color: rgba(255,255,255,0.3);
    }

    .quote {
        font-size: 36px;
        font-weight: 700;
        line-height: 2.2;
        margin: 30px 0;
        animation: fadeIn 2s ease;
    }

    .quote span {
        display: block;
    }

    .name {
        margin-top: 40px;
        font-size: 14px;
        color: rgba(255,255,255,0.5);
        letter-spacing: 1px;
    }

    .name::before {
        content: "— ";
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>

</head>

<body>

<div class="card">

    <div class="title">QUOTE OF THE DAY</div>
    <div class="date" id="date"></div>

    <div class="line">✦ ───────────── ✦</div>

    <div class="quote">
        <span>هَكَذَا الدُّنْيَا...</span>
        <span>وَكُلُّ مَا عَلَيْهَا فَانٍ.</span>
    </div>

    <div class="line">✦ ───────────── ✦</div>

    <div class="name">
        mohamed ahmed mohamed ghazly
    </div>

</div>

<script>
    const today = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById("date").innerText = today.toLocaleDateString('en-US', options);
</script>

</body>
</html>
