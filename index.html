<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اقتباس اليوم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cairo', sans-serif;
    transition: 1s;
    color: white;
}

.card {
    width: 650px;
    padding: 60px 40px;
    border-radius: 25px;
    text-align: center;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 80px rgba(0,0,0,0.5);
    animation: fadeIn 1.5s;
}

.title {
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0.7;
}

.date {
    margin: 10px 0 25px;
    font-size: 14px;
    opacity: 0.6;
}

.quote {
    font-size: 34px;
    line-height: 2.2;
    margin: 30px 0;
}

.en {
    font-size: 18px;
    opacity: 0.7;
    margin-top: 15px;
}

.symbol {
    font-size: 22px;
    margin: 15px 0;
    opacity: 0.5;
}

.name {
    margin-top: 40px;
    font-size: 14px;
    opacity: 0.6;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}
</style>

</head>

<body>

<div class="card">

<div class="title">اقتباس اليوم</div>
<div class="date" id="date"></div>

<div class="symbol" id="symbol"></div>

<div class="quote" id="quote"></div>
<div class="en" id="quoteEn"></div>

<div class="symbol" id="symbol2"></div>

<div class="name">— mohamed ahmed mohamed ghazly</div>

</div>

<script>

// اقتباسات جامدة 🔥
const quotes = [
{
ar: "هَكَذَا الدُّنْيَا... وَكُلُّ مَا عَلَيْهَا فَانٍ، فَلَا تَتَعَلَّقْ بِمَا يَزُول.",
en: "This is life... everything upon it fades, so do not cling to what will vanish.",
bg: "radial-gradient(circle, #000000, #1a1a1a)",
symbol: "✦ ───────────── ✦"
},
{
ar: "أَكْبَرُ خَدِيعَةٍ فِي الحَيَاةِ... أَنْ تَظُنَّ أَنَّ لَكَ وَقْتًا كَافِيًا.",
en: "The greatest illusion in life is thinking you have enough time.",
bg: "linear-gradient(135deg, #1f1c2c, #928dab)",
symbol: "⏳ ───────────── ⏳"
},
{
ar: "مَنْ أَتْقَنَ الصَّبْرَ... لَمْ تَكْسِرْهُ الحَيَاةُ أَبَدًا.",
en: "Who masters patience can never be broken by life.",
bg: "linear-gradient(135deg, #0f2027, #203a43, #2c5364)",
symbol: "☾ ───────────── ☾"
},
{
ar: "لَا تَبْحَثْ عَنْ السَّعَادَةِ... بَلِ اصْنَعْهَا فِي أَبْسَطِ التَّفَاصِيلِ.",
en: "Do not search for happiness... create it in the simplest details.",
bg: "linear-gradient(135deg, #42275a, #734b6d)",
symbol: "❖ ───────────── ❖"
},
{
ar: "أَقْوَى النُّفُوسِ... هِيَ الَّتِي خَبِرَتِ الأَلَمَ وَابْتَسَمَتْ.",
en: "The strongest souls are those who knew pain and still smiled.",
bg: "linear-gradient(135deg, #141e30, #243b55)",
symbol: "✧ ───────────── ✧"
}
];

// اختيار عشوائي
const q = quotes[Math.floor(Math.random() * quotes.length)];

document.getElementById("quote").innerText = q.ar;
document.getElementById("quoteEn").innerText = q.en;
document.body.style.background = q.bg;
document.getElementById("symbol").innerText = q.symbol;
document.getElementById("symbol2").innerText = q.symbol;

// تاريخ عربي
const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
document.getElementById("date").innerText =
today.toLocaleDateString('ar-EG', options);

</script>

</body>
</html>
