<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Quote Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cairo', sans-serif;
    transition: 0.8s;
    color: white;
}

.card {
    width: 750px;
    padding: 60px 50px;
    border-radius: 25px;
    text-align: center;
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 90px rgba(0,0,0,0.6);
    transition: 0.5s;
}

.title {
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0.7;
}

.date {
    margin: 10px 0 25px;
    font-size: 14px;
    opacity: 0.6;
}

.quote {
    font-size: 34px;
    line-height: 2.3;
    margin: 30px 0;
}

.en {
    font-size: 18px;
    opacity: 0.75;
}

.symbol {
    font-size: 24px;
    margin: 15px 0;
    opacity: 0.6;
}

button {
    margin-top: 25px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

.name {
    margin-top: 40px;
    font-size: 13px;
    opacity: 0.5;
}
</style>

</head>

<body>

<div class="card">

<div class="title">QUOTE ENGINE</div>
<div class="date" id="date"></div>

<div class="symbol" id="symbol"></div>

<div class="quote" id="quote"></div>
<div class="en" id="quoteEn"></div>

<div class="symbol" id="symbol2"></div>

<button onclick="generateQuote()">اقتباس جديد</button>

<div class="name">— mohamed ahmed mohamed ghazly</div>
    <h2>magdev.online</h2>

</div>

<audio id="sound">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a7b3b9b3.mp3?filename=click-124467.mp3" type="audio/mpeg">
</audio>

<script>

// 🔥 الاقتباسات حسب النوع (مختلفة فعلاً مش نفس النمط)
const quotes = [
{
type:"philosophy",
ar:"الحقيقة لا تُرى... بل تُفهم بالصمت.",
en:"Truth is understood in silence.",
bg:"linear-gradient(135deg,#0f2027,#203a43,#2c5364)",
symbol:"☾"
},
{
type:"motivation",
ar:"لا تنتظر الفرصة... اصنعها بنفسك مهما كان الطريق صعب.",
en:"Create your own opportunity.",
bg:"linear-gradient(135deg,#1e3c72,#2a5298)",
symbol:"⚡"
},
{
type:"reality",
ar:"ليس كل من وعدك باقٍ... والبقاء ليس للجميع.",
en:"Not everyone who promised stays.",
bg:"linear-gradient(135deg,#000428,#004e92)",
symbol:"✦"
},
{
type:"calm",
ar:"كل شيء يمر... حتى الألم يتعب ويرحل.",
en:"Everything passes eventually.",
bg:"linear-gradient(135deg,#232526,#414345)",
symbol:"✧"
},
{
type:"philosophy",
ar:"الصمت ليس فراغًا... بل امتلاء بالفهم.",
en:"Silence is full of understanding.",
bg:"linear-gradient(135deg,#141e30,#243b55)",
symbol:"☾"
},
{
type:"motivation",
ar:"أقوى نسختك لم تظهر بعد.",
en:"Your strongest version is not here yet.",
bg:"linear-gradient(135deg,#373B44,#4286f4)",
symbol:"⚡"
},
{
type:"reality",
ar:"بعض الخسارات... كانت إنقاذًا متأخرًا.",
en:"Some losses are hidden salvation.",
bg:"linear-gradient(135deg,#1f1c2c,#928dab)",
symbol:"✦"
},
{
type:"calm",
ar:"لا شيء يدوم... وهذا سر راحة القلب.",
en:"Nothing lasts, and that is peace.",
bg:"linear-gradient(135deg,#16222A,#3A6073)",
symbol:"✧"
}
];

let used = [];

function generateQuote(){

    const sound = document.getElementById("sound");
    sound.currentTime = 0;
    sound.play().catch(()=>{});

    let q;

    // 🚫 منع التكرار
    do {
        q = quotes[Math.floor(Math.random()*quotes.length)];
    } while(used.includes(q.ar));

    used.push(q.ar);

    // إعادة التدوير لو خلصوا
    if(used.length === quotes.length){
        used = [];
    }

    document.body.style.background = q.bg;

    document.getElementById("quote").innerText = q.ar;
    document.getElementById("quoteEn").innerText = q.en;
    document.getElementById("symbol").innerText = q.symbol;
    document.getElementById("symbol2").innerText = q.symbol;

}

// 📅 تاريخ عربي
document.getElementById("date").innerText =
new Date().toLocaleDateString('ar-EG',{
weekday:'long', year:'numeric', month:'long', day:'numeric'
});

// أول تشغيل
generateQuote();

</script>

</body>
</html>
